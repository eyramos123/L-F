<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details - TraceBack</title>
  
  <!-- CSS Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <!-- Dynamic Header / Navbar -->
  <header></header>

  <!-- Loader overlay -->
  <div id="loading-overlay">
    <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 fs-5 fw-bold text-white">Retrieving item details...</p>
  </div>

  <!-- Main Content Wrapper -->
  <main class="container py-5" style="margin-top: 75px;">
    
    <!-- Link back -->
    <div class="mb-4 animate-slide-up">
      <a href="index.html" class="btn btn-link text-decoration-none text-emerald p-0">
        <i class="bi bi-arrow-left"></i> Back to Catalog
      </a>
    </div>

    <!-- Mount node for details template populated by js/reports.js -->
    <div id="details-container">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-emerald mb-2" role="status"></div>
        <p>Loading report specifications...</p>
      </div>
    </div>

  </main>

  <!-- Dynamic Footer -->
  <footer></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import "./js/auth.js";
    import { auth, onAuthStateChanged } from "./js/firebase.js";
    import { loadReportDetails } from "./js/reports.js";
    import { initTheme, showToast } from "./js/utils.js";

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();

      // Parse the ID parameter from URL queries (e.g. ?id=XYZ)
      const urlParams = new URLSearchParams(window.location.search);
      const reportId = urlParams.get('id');

      // Authentication is required to read details and contact owners
      onAuthStateChanged(auth, (user) => {
        if (user) {
          if (reportId) {
            loadReportDetails(reportId);
          } else {
            showToast("No report ID provided in the URL.", "danger");
            document.getElementById('details-container').innerHTML = `
              <div class="alert alert-danger py-4 text-center">
                <i class="bi bi-exclamation-triangle-fill fs-3 mb-2 d-block"></i>
                <h4>Invalid Access</h4>
                <p class="mb-0">Please return to the search index and choose a valid item card.</p>
                <a href="index.html" class="btn btn-outline-primary mt-3">Go to Catalog</a>
              </div>
            `;
          }
        }
      });
    });
  </script>
</body>
</html>
